<style>
  :root { --primary:#30d158; --hue-green:#30d158; --hue-teal:#64d2ff; --hue-purple:#bf5af2; --hue-orange:#ff9f0a; }
  body { background:#000; margin:0; padding:48px; font-family:system-ui; color:#fff; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:56px; max-width:1100px; }
  .row { display:flex; gap:26px; align-items:center; }
  .badge { display:grid; place-items:center; border-radius:999px; background:#30d158; color:#00320f; }
  h3 { font-size:13px; color:#8e8e93; font-weight:600; margin:0 0 16px; letter-spacing:.02em }
  .note { font-size:12px; color:#48484a; margin-top:14px; line-height:1.5 }
</style>
<div class="grid">

  <div>
    <h3>A. Divided square</h3>
    <div class="row">
      <svg viewBox="0 0 64 64" width="92" height="92">
        <rect x="6" y="6" width="52" height="52" rx="15" fill="none" stroke="var(--primary)" stroke-width="4"/>
        <rect x="17" y="18" width="30" height="6" rx="3" fill="var(--hue-green)"/>
        <rect x="17" y="29" width="21" height="6" rx="3" fill="var(--hue-teal)"/>
        <rect x="17" y="40" width="13" height="6" rx="3" fill="var(--hue-purple)"/>
      </svg>
      <span class="badge" style="width:40px;height:40px">
        <svg viewBox="0 0 64 64" width="23" height="23">
          <rect x="6" y="6" width="52" height="52" rx="15" fill="none" stroke="currentColor" stroke-width="4"/>
          <rect x="17" y="18" width="30" height="6" rx="3" fill="currentColor"/>
          <rect x="17" y="29" width="21" height="6" rx="3" fill="currentColor"/>
          <rect x="17" y="40" width="13" height="6" rx="3" fill="currentColor"/>
        </svg>
      </span>
      <svg viewBox="0 0 64 64" width="20" height="20">
        <rect x="6" y="6" width="52" height="52" rx="15" fill="none" stroke="var(--primary)" stroke-width="4"/>
        <rect x="17" y="18" width="30" height="6" rx="3" fill="var(--hue-green)"/>
        <rect x="17" y="29" width="21" height="6" rx="3" fill="var(--hue-teal)"/>
        <rect x="17" y="40" width="13" height="6" rx="3" fill="var(--hue-purple)"/>
      </svg>
    </div>
    <p class="note">Reads as a text align icon when small.</p>
  </div>

  <div>
    <h3>B. The split ring</h3>
    <div class="row">
      <svg viewBox="0 0 64 64" width="92" height="92">
        <circle cx="32" cy="32" r="22" fill="none" stroke="var(--hue-green)" stroke-width="9"
          stroke-dasharray="58 80" stroke-linecap="butt" transform="rotate(-90 32 32)"/>
        <circle cx="32" cy="32" r="22" fill="none" stroke="var(--hue-teal)" stroke-width="9"
          stroke-dasharray="34 104" stroke-dashoffset="-61" stroke-linecap="butt" transform="rotate(-90 32 32)"/>
        <circle cx="32" cy="32" r="22" fill="none" stroke="var(--hue-purple)" stroke-width="9"
          stroke-dasharray="24 114" stroke-dashoffset="-98" stroke-linecap="butt" transform="rotate(-90 32 32)"/>
      </svg>
      <span class="badge" style="width:40px;height:40px">
        <svg viewBox="0 0 64 64" width="23" height="23">
          <circle cx="32" cy="32" r="22" fill="none" stroke="currentColor" stroke-width="10"
            stroke-dasharray="58 80" transform="rotate(-90 32 32)"/>
          <circle cx="32" cy="32" r="22" fill="none" stroke="currentColor" stroke-width="10" opacity=".55"
            stroke-dasharray="34 104" stroke-dashoffset="-61" transform="rotate(-90 32 32)"/>
        </svg>
      </span>
      <svg viewBox="0 0 64 64" width="20" height="20">
        <circle cx="32" cy="32" r="22" fill="none" stroke="var(--hue-green)" stroke-width="11"
          stroke-dasharray="58 80" transform="rotate(-90 32 32)"/>
        <circle cx="32" cy="32" r="22" fill="none" stroke="var(--hue-teal)" stroke-width="11"
          stroke-dasharray="34 104" stroke-dashoffset="-61" transform="rotate(-90 32 32)"/>
        <circle cx="32" cy="32" r="22" fill="none" stroke="var(--hue-purple)" stroke-width="11"
          stroke-dasharray="24 114" stroke-dashoffset="-98" transform="rotate(-90 32 32)"/>
      </svg>
    </div>
    <p class="note">The budget ring itself, the thing the app is.</p>
  </div>

  <div>
    <h3>C. Split E</h3>
    <div class="row">
      <svg viewBox="0 0 64 64" width="92" height="92">
        <path d="M14 14 h30 a9 9 0 0 1 0 18 h-30" fill="none" stroke="var(--hue-green)" stroke-width="8" stroke-linecap="round"/>
        <path d="M14 32 h20" fill="none" stroke="var(--hue-teal)" stroke-width="8" stroke-linecap="round"/>
        <path d="M14 50 h26 a9 9 0 0 0 0-18" fill="none" stroke="var(--hue-purple)" stroke-width="8" stroke-linecap="round"/>
      </svg>
      <span class="badge" style="width:40px;height:40px">
        <svg viewBox="0 0 64 64" width="24" height="24">
          <path d="M14 14 h30 a9 9 0 0 1 0 18 h-30" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round"/>
          <path d="M14 50 h26 a9 9 0 0 0 0-18" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round"/>
        </svg>
      </span>
      <svg viewBox="0 0 64 64" width="20" height="20">
        <path d="M14 14 h30 a9 9 0 0 1 0 18 h-30" fill="none" stroke="var(--hue-green)" stroke-width="9" stroke-linecap="round"/>
        <path d="M14 50 h26 a9 9 0 0 0 0-18" fill="none" stroke="var(--hue-purple)" stroke-width="9" stroke-linecap="round"/>
      </svg>
    </div>
    <p class="note">An E built from two arcs, the letter and a flow.</p>
  </div>

</div>
